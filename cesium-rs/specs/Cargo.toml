[package]
name = "cesium-specs"
description = "Mirror test container: one-to-one Rust ports of the CesiumJS Jasmine specs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Test-only crate: the library part only provides shared spec helpers.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
cesium-core = { workspace = true }
cesium-shaders = { workspace = true }
cesium-workers = { workspace = true }
cesium-renderer = { workspace = true }
cesium-scene = { workspace = true }
cesium-data-sources = { workspace = true }
cesium-widgets = { workspace = true }
cesium-test-utils = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
