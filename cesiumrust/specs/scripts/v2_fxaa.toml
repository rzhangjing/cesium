# v2_fxaa.toml — M5-E1 FXAA (quality preset 12) baseline capture script
# ======================================================================
# Six-view capture exercising the self-implemented FXAA render-graph node
# (CESIUM_ENABLE_POSTPROCESS=1). FXAA is a subtle edge anti-alias: expect
# slightly softened high-contrast edges (globe limb, tile seams, coastline)
# vs. the v0 baseline, with structure fully preserved.
#
# Poses are IDENTICAL to baseline_v0.toml so the ONLY variable is the FXAA
# gate. This lets the gate ON↔OFF comparison isolate FXAA:
#   • gate OFF (default): specs/baselines/v0/*.png  → PSNR=∞ (zero diff, non-regression)
#   • gate ON            : these 6 views           → target PSNR ≥ 40 dB vs v0
#                         (FXAA is anti-aliasing: measurable but structure-preserving)
#
# Run with (gate ON):
#   CESIUM_ENABLE_POSTPROCESS=1
#   FIXED_TIME=1
#   OFFLINE_IMAGERY_ROOT=specs/fixtures/offline-imagery
#   OFFLINE_TERRAIN_ROOT=specs/fixtures/offline-terrain
#   STRICT_OFFLINE=1
#   CESIUM_SCREENSHOT_SCRIPT=specs/scripts/v2_fxaa.toml
#   CESIUM_SCREENSHOT_DIR=specs/baselines/v2_fxaa
#   CESIUM_GIT_SHA=$(git rev-parse HEAD)
#   cargo run --release -p cesium-app
#
# NOTE: headless CI has no GPU/window, so these 6 PNGs are NOT captured here
# (specs/baselines/v2_fxaa/ ships empty). Capture + PSNR measurement is deferred
# to the xvfb e2e runner (`.github/workflows/cesiumrust-e2e.yml`, M11.2 ready) —
# see docs/deferred.md. On headless, verification degrades to the compile-time +
# render-graph structural assertions in adapters/bevy-render/src/effects/{graph,fxaa}.rs
# (FXAA node inserted after Tonemapping, before EndMainPassPostProcessing).
#
# Frame gaps (180) give async tile streaming time to settle between views;
# the harness exits 30 frames after the last shot for GPU flush.

[meta]
name = "v2_fxaa"
description = "M5-E1 six-view FXAA baseline (quality preset 12, CESIUM_ENABLE_POSTPROCESS=1, FIXED_TIME=1, offline assets)"

[[shot]]
frame = 180
name = "fxaa_globe_default"
pos = [2.763183, 0.000000, 1.168255]
quat = [0.390699, 0.390699, 0.589368, 0.589368]
fov_y = 60.0

[[shot]]
frame = 360
name = "fxaa_pole_north"
pos = [0.520945, 0.000000, 2.954423]
quat = [0.061628, 0.061628, 0.704416, 0.704416]
fov_y = 60.0

[[shot]]
frame = 540
name = "fxaa_pole_south"
pos = [0.520945, 0.000000, -2.954423]
quat = [0.704416, 0.704416, 0.061628, 0.061628]
fov_y = 60.0

[[shot]]
frame = 720
name = "fxaa_zoom_mid"
pos = [1.841010, 0.000000, 0.781462]
quat = [0.390278, 0.390278, 0.589646, 0.589646]
fov_y = 60.0

[[shot]]
frame = 900
name = "fxaa_zoom_close"
pos = [1.104606, 0.000000, 0.468877]
quat = [0.390278, 0.390278, 0.589646, 0.589646]
fov_y = 60.0

[[shot]]
frame = 1080
name = "fxaa_terrain_off"
pos = [2.763183, 0.000000, 1.168255]
quat = [0.390699, 0.390699, 0.589368, 0.589368]
fov_y = 60.0
