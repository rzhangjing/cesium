[workspace]
resolver = "2"
members = [
    # Domain layer (pure Rust, no framework dependency)
    "domain/geospatial",
    "domain/time",
    "domain/camera",
    "domain/event",
    "domain/resource",
    "domain/terrain",
    "domain/imagery",
    "domain/tileset",
    "domain/gltf",
    "domain/scene",
    "domain/datasource",
    "domain/material",
    "domain/atmosphere",
    "domain/interaction",
    "domain/effects",
    "domain/shadow",
    "domain/crs",
    "domain/kml",
    "domain/gpx",
    "domain/provider",
    "domain/styling",
    "domain/globe",
    "domain/quadtree",
    "domain/primitives",
    "domain/animation",
    "domain/implicit-tiling",
    "domain/vector",
    "domain/scene-mode",
    "domain/performance",
    "domain/voxel",
    "domain/widgets",
    # Ports layer (trait contracts)
    "ports/driven",
    "ports/driving",
    # Adapters layer (Bevy/IO implementations)
    "adapters/bevy-render",
    "adapters/decoders",
    "adapters/network",
    # Application layer (Bevy App assembly)
    "application/cesium-app",
]
default-members = ["application/cesium-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Math (f64 precision)
glam = { version = "0.29", features = ["fast-math", "serde"] }

# Game engine / rendering
bevy = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Async
tokio = { version = "1", features = ["full"] }

# Internal domain crates
cesium-geospatial = { path = "domain/geospatial" }
cesium-time = { path = "domain/time" }
cesium-camera = { path = "domain/camera" }
cesium-event = { path = "domain/event" }
cesium-resource = { path = "domain/resource" }
cesium-terrain = { path = "domain/terrain" }
cesium-imagery = { path = "domain/imagery" }
cesium-tileset = { path = "domain/tileset" }
cesium-gltf = { path = "domain/gltf" }
cesium-scene = { path = "domain/scene" }
cesium-datasource = { path = "domain/datasource" }
cesium-material = { path = "domain/material" }
cesium-atmosphere = { path = "domain/atmosphere" }
cesium-interaction = { path = "domain/interaction" }
cesium-effects = { path = "domain/effects" }
cesium-shadow = { path = "domain/shadow" }
cesium-crs = { path = "domain/crs" }
cesium-kml = { path = "domain/kml" }
cesium-gpx = { path = "domain/gpx" }
cesium-provider = { path = "domain/provider" }
cesium-styling = { path = "domain/styling" }
cesium-globe = { path = "domain/globe" }
cesium-quadtree = { path = "domain/quadtree" }
cesium-primitives = { path = "domain/primitives" }
cesium-animation = { path = "domain/animation" }
cesium-implicit-tiling = { path = "domain/implicit-tiling" }
cesium-vector = { path = "domain/vector" }
cesium-scene-mode = { path = "domain/scene-mode" }
cesium-performance = { path = "domain/performance" }
cesium-voxel = { path = "domain/voxel" }
cesium-widgets = { path = "domain/widgets" }

# Internal port crates
cesium-ports-driven = { path = "ports/driven" }
cesium-ports-driving = { path = "ports/driving" }

# Internal adapter crates
cesium-bevy-render = { path = "adapters/bevy-render" }
cesium-decoders = { path = "adapters/decoders" }
cesium-network = { path = "adapters/network" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
debug = "limited"
