# cesiumrust CI 门禁基线（M0.7）
# 仅覆盖 cesiumrust/ 子目录；不含 e2e 渲染测试（M11）。
# 已知豁免见 cesiumrust/docs/deferred.md。

name: cesiumrust-ci

on:
  push:
    paths:
      - 'cesiumrust/**'
      - '.github/workflows/cesiumrust-ci.yml'
  pull_request:
    paths:
      - 'cesiumrust/**'
      - '.github/workflows/cesiumrust-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesiumrust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cesiumrust

      - name: Install system dependencies (Bevy/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      # 门禁 1（强制、硬失败）: 全 workspace（含 cesium-specs）零警告。
      # cesium-time/resource/voxel 的 pre-existing 债务已逐点加局部 #[allow] + 注释指向
      # deferred.md #13–#15（已验证 -D warnings 通过）。cesium-specs 的假绿/正确性 lint
      # 债务（deferred.md #3–#5）已于 M3.3 清零：无符号 `>= 0`、`|| true`、恒等运算、
      # if/else 同分支等 vacuous 断言已改为真实断言，纯风格 lint 经 specs/Cargo.toml 的
      # [lints.clippy] / [lints.rust] 精确处置（correctness 假绿项仍 deny）。故不再排除
      # cesium-specs —— specs 漂移将直接阻塞 CI。
      - name: cargo clippy (full workspace, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesiumrust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cesiumrust

      - name: Install system dependencies (Bevy/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      # 门禁 2（强制、硬失败）: cargo test --workspace。
      # material_integration_test 4 个 headless panic 用例已逐个加 #[ignore]（deferred.md #6，
      # M5.1 解阻），因此不再需要 --no-fail-fast / continue-on-error 放行整个 job；
      # 任何新增测试失败将真正阻塞 CI（对齐计划 M11.6「禁止 #[ignore] 逃逸」范式）。
      # FIX-CI-GPU（deferred.md #75）：e2e_render.rs 5 个真 GPU 子进程渲染测试已加 #[ignore]，
      # 从本**无 GPU/adapter** 的强制门路由到 cesiumrust-e2e.yml（xvfb + llvmpipe，nightly/手动，
      # 非阻塞）经 --ignored 执行；否则本 runner 会收集它们、子进程取不到 wgpu adapter 而挂/红，
      # 违背本 workflow 头注释「不含 e2e 渲染测试」的既定意图。此为「按硬件需求分流」而非逃逸。
      - name: cargo test
        run: cargo test --workspace
        env:
          RUST_BACKTRACE: 1

  build:
    name: Build (release, cesium-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cesiumrust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cesiumrust

      - name: Install system dependencies (Bevy/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      # 门禁 3: cargo build --release -p cesium-app
      - name: cargo build release
        run: cargo build --release -p cesium-app

  # 文档完整性软门（M13 Wave A · task #82）: 交叉验证 docs/deviations.md 每个 DEV
  # 条目的代码锚点（file 存在 + 行号/全文范围未漂移 + 符号未消失）与 docs/deferred.md
  # 台账自洽（编号不重复 + 状态标记不矛盾 + 统计段计数匹配实际条目）。
  # 软门姿态（continue-on-error: true）——仅在 PR 检查列表告警留证，绝不阻塞合并；
  # 与三门（clippy/test/build）解耦，纯 pwsh 运行，无需 Rust 工具链 / cargo 缓存 / apt。
  # M13 完整版（依赖 M12 gen_mapping 等）就绪后转硬门：移除 continue-on-error 并加 -FailOnWarning。
  check-deviations:
    name: Docs integrity (check_deviations, soft gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: cesiumrust
    steps:
      - uses: actions/checkout@v4

      # 用 pwsh -File（非 shell: pwsh）绕过 execution policy；ubuntu-latest 预装 pwsh 7。
      # 脚本 ASCII-only，Windows PowerShell 5.x 与 pwsh 7 均可跑（本地已验 5.x）。
      - name: Run check_deviations.ps1 (pwsh)
        run: pwsh -NoLogo -NoProfile -File ./tools/check_deviations.ps1
